<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奧特曼揭牌抽籤</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%86%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>奧特曼揭牌抽籤 <span class="spark">✦</span></h1>
    <p class="subtitle">奧特曼撕下封紙，抽出今天的幸運之星 ✨</p>
    <!-- local class list (seat number + name): stored only in this browser's localStorage, never uploaded -->
    <button class="rosterbtn" id="rosterBtn" type="button" aria-haspopup="dialog">📋 名單</button>
  </header>

  <main class="wrap">
    <div class="herowrap">
      <picture>
        <source media="(max-width: 640px)" srcset="hero-mobile-noarm.webp">
        <img class="stageimg" src="hero-noarm.webp" alt="奧特曼站在黑板旁">
      </picture>
      <!-- v6: the whole reaching arm is a cut-out overlay in two nested parts:
           .arm rotates at the shoulder, .fore (forearm + hand) rotates at the elbow inside it.
           The upper hand holding the board stays still in the background. -->
      <div class="arm" id="arm" aria-hidden="true">
        <img class="upper" src="upper-arm.webp" alt="">
        <img class="fore" id="fore" src="forearm.webp" alt="">
      </div>
    </div>

    <!-- reveal panel positioned over the dark board of hero-noarm.webp -->
    <div class="panel idle" id="panel">
      <div class="panel-inner">
        <!-- a stack of artwork sheets (3 reusable layers, round-robin; no DOM per tick).
             Each draw tick Ultraman grabs the top sheet at the grip corner and tears it off. -->
        <div class="sheet" id="sheet0" hidden><img class="sheetimg" src="artworks/art1-traffic.jpg" alt=""></div>
        <div class="sheet" id="sheet1" hidden><img class="sheetimg" src="artworks/art2-star.jpg" alt=""></div>
        <div class="sheet" id="sheet2" hidden><img class="sheetimg" src="artworks/art3-sweet.jpg" alt=""></div>

        <!-- idle cover sheet: cream paper, four intact edges; the first tear removes it -->
        <div class="cover" id="cover"><span class="plabel" id="coverLabel">等待撕牌</span></div>

        <!-- winner name: empty (and hidden) until the winner is revealed -->
        <div class="nm" id="artname"></div>
      </div>

      <!-- paper scraps that burst from the top / right edges on each rip -->
      <div class="shard" hidden></div>
      <div class="shard" hidden></div>
      <div class="shard" hidden></div>

      <!-- gold winner badge, rides on the top edge of the board frame -->
      <div class="badge" id="badge">🏆 中籤！</div>
    </div>

    <div class="hud" id="hud" aria-live="polite" role="status">按下按鈕，看奧特曼替你撕牌抽籤！</div>
  </main>

  <!-- winner zoom (lightbox): opened by clicking the winning artwork, closed by click / Esc -->
  <div class="zoom" id="zoom" hidden role="dialog" aria-modal="true" aria-label="中籤作品放大" tabindex="-1">
    <img class="zoomimg" id="zoomImg" src="data:," alt="">
    <div class="zoomcap" id="zoomCap"></div>
    <div class="zoomhint">點一下或按 Esc 關閉</div>
  </div>

  <!-- local class list editor: paste only (never via URL), saved only in this browser's localStorage -->
  <div class="roster" id="roster" hidden role="dialog" aria-modal="true" aria-labelledby="rosterTitle">
    <div class="rosterbox">
      <h2 class="rostertitle" id="rosterTitle">本機名單（座號＋名字）</h2>
      <p class="rosterhelp">每行一件作品：<b>作品編號</b>或<b>王國名稱</b>、座號、名字，用空白隔開。沒填的作品會顯示原本的暱稱。</p>
      <p class="rosterhelp" id="rosterKeys"></p>
      <div class="rostersaved" id="rosterSaved" hidden>
        <span id="rosterSavedText"></span>
        <button class="linkbtn" id="rosterReveal" type="button" aria-expanded="false">顯示內容</button>
      </div>
      <textarea class="rostertext" id="rosterText" rows="5" maxlength="2000" autocomplete="off" spellcheck="false" autocapitalize="off" aria-label="貼上名單" placeholder="作品1 00000 範例&#10;作品2 00000 範例&#10;作品3 00000 範例"></textarea>
      <p class="rosternote">🔒 名單只存在這台電腦的瀏覽器裡，不會上傳到任何地方。換電腦要重新貼上。</p>
      <p class="rosterstatus" id="rosterStatus" role="status" aria-live="polite"></p>
      <div class="rosteractions">
        <button class="btn ghost small danger" id="rosterClear" type="button">清除名單</button>
        <span class="rosterspacer"></span>
        <button class="btn small" id="rosterSave" type="button">儲存名單</button>
        <button class="btn ghost small" id="rosterClose" type="button">關閉</button>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="startBtn" disabled aria-disabled="true">載入作品中…</button>
    <button class="btn ghost" id="resetBtn">重置</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
